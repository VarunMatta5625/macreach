<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d">
  <title id="t">First launch: Open Anyway</title>
  <desc id="d">Illustration of the three steps to get past the macOS block on the first launch of an app that is not notarized.</desc>
  <defs><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e8efff}
    .sub{fill:#9db4e8;font-size:15px}.h{font-size:20px;font-weight:700}
    .win{fill:#2a2a2d;stroke:#48484a;stroke-width:1.5}.btn{fill:#48484a}.btnb{fill:#0a84ff}
    .it{font-size:15px;fill:#f2f2f7}.dim{fill:#8e8e93;font-size:14px}
    .red{fill:none;stroke:#ff3b30;stroke-width:4;rx:10}
    .pulse{animation:p 1.4s ease-in-out infinite}@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
    .num{fill:#ff3b30}.numt{font-size:20px;font-weight:800;fill:#fff}
  </style>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff3b30"/></marker></defs>
  <rect width="1280" height="470" rx="22" fill="#0b1220"/>
  <text class="h" x="40" y="46">The first launch is blocked once, because the app is not notarized</text>
  <!-- 1 -->
  <g transform="translate(40,80)">
    <circle class="num" cx="18" cy="18" r="18"/><text class="numt" x="18" y="25" text-anchor="middle">1</text>
    <text class="h" x="48" y="25">Open MacReach</text>
    <rect class="win" x="0" y="50" width="360" height="250" rx="14"/>
    <text class="it" x="180" y="100" text-anchor="middle" style="font-weight:700">“MacReach” cannot be opened</text>
    <text class="dim" x="180" y="128" text-anchor="middle">Apple could not verify that it is free</text>
    <text class="dim" x="180" y="148" text-anchor="middle">of malware or other harmful software.</text>
    <rect class="btn" x="40" y="236" width="120" height="34" rx="8"/><text class="it" x="100" y="258" text-anchor="middle">Done</text>
    <rect class="btnb" x="200" y="236" width="130" height="34" rx="8"/><text class="it" x="265" y="258" text-anchor="middle">Move to Trash</text>
    <text class="sub" x="0" y="330">Do not move it to the Trash. Click Done.</text>
  </g>
  <!-- 2 -->
  <g transform="translate(460,80)">
    <circle class="num" cx="18" cy="18" r="18"/><text class="numt" x="18" y="25" text-anchor="middle">2</text>
    <text class="h" x="48" y="25">System Settings</text>
    <rect class="win" x="0" y="50" width="360" height="250" rx="14"/>
    <text class="it" x="20" y="84" style="font-weight:700">Privacy &amp; Security</text>
    <text class="dim" x="20" y="116">…</text>
    <text class="it" x="20" y="150">Security</text>
    <text class="dim" x="20" y="178">“MacReach” was blocked to protect your Mac.</text>
    <rect class="btn" x="230" y="196" width="112" height="34" rx="8"/><text class="it" x="286" y="218" text-anchor="middle">Open Anyway</text>
    <rect class="red pulse" x="224" y="190" width="124" height="46" rx="10"/>
    <text class="sub" x="0" y="330">Scroll down to the Security section. Confirm</text><text class="sub" x="0" y="352">with your password or Touch ID.</text>
  </g>
  <!-- 3 -->
  <g transform="translate(880,80)">
    <circle class="num" cx="18" cy="18" r="18"/><text class="numt" x="18" y="25" text-anchor="middle">3</text>
    <text class="h" x="48" y="25">Open MacReach again</text>
    <rect class="win" x="0" y="50" width="360" height="250" rx="14"/>
    <text class="it" x="180" y="108" text-anchor="middle" style="font-weight:700">Set up MacReach</text>
    <text class="dim" x="180" y="136" text-anchor="middle">The Setup assistant opens.</text>
    <g class="it"><text x="40" y="180">✓  Screen Recording</text><text x="40" y="210">✓  Accessibility</text><text x="40" y="240">–  Notifications</text></g>
    <text class="sub" x="0" y="330">Terminal alternative:</text>
    <text x="0" y="354" style="font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#8fd1ff">xattr -dr com.apple.quarantine \</text><text x="0" y="372" style="font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#8fd1ff">  /Applications/MacReach.app</text>
  </g>
  <path d="M410 200H452" stroke="#ff3b30" stroke-width="4" marker-end="url(#a)"/>
  <path d="M830 200H872" stroke="#ff3b30" stroke-width="4" marker-end="url(#a)"/>
  <text class="sub" x="40" y="450">Illustration (the real macOS dialogs vary slightly between versions). Only needed once.</text>
</svg>
