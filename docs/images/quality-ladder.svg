<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="t d">
  <title id="t">The quality ladder</title>
  <desc id="d">Six quality levels from saver (0.9 Mbps) to native (16 Mbps). The starting level is 1080p.</desc>
  <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e8efff}.h{font-size:22px;font-weight:700}.sub{fill:#9db4e8;font-size:15px}.it{font-size:17px;fill:#f2f2f7}.dim{fill:#9db4e8;font-size:16px}</style></defs>
  <rect width="1280" height="560" rx="22" fill="#0b1220"/>
  <text class="h" x="40" y="50">The quality ladder (server/src/quality.js)</text>
  <text class="sub" x="40" y="78">Level 0 is the smallest. The controller steps down fast when the link is congested and climbs slowly when it is calm. ★ = where a new session starts.</text>
  <text class="sub" x="190" y="104">size cap @ frame rate</text><text class="sub" x="420" y="104">target bitrate</text>
  <text class="it" x="40" y="134" style="font-weight:700">0  saver</text><text class="dim" x="190" y="134">960×600 @ 15 fps</text><rect x="420" y="110" width="520" height="34" rx="8" fill="#16243f"/><rect x="420" y="110" width="29" height="34" rx="8" fill="#64d2ff"><animate attributeName="width" from="0" to="29" dur="0.9s" begin="0.00s" fill="freeze"/></rect><text class="it" x="461" y="134">0.9 Mbps</text><text class="it" x="40" y="196" style="font-weight:700">1  low</text><text class="dim" x="190" y="196">1280×800 @ 24 fps</text><rect x="420" y="172" width="520" height="34" rx="8" fill="#16243f"/><rect x="420" y="172" width="65" height="34" rx="8" fill="#5ac8fa"><animate attributeName="width" from="0" to="65" dur="0.9s" begin="0.12s" fill="freeze"/></rect><text class="it" x="497" y="196">2 Mbps</text><text class="it" x="40" y="258" style="font-weight:700">2  medium</text><text class="dim" x="190" y="258">1600×1000 @ 30 fps</text><rect x="420" y="234" width="520" height="34" rx="8" fill="#16243f"/><rect x="420" y="234" width="114" height="34" rx="8" fill="#0a84ff"><animate attributeName="width" from="0" to="114" dur="0.9s" begin="0.24s" fill="freeze"/></rect><text class="it" x="546" y="258">3.5 Mbps</text><text class="it" x="40" y="320" style="font-weight:700">3  1080p ★</text><text class="dim" x="190" y="320">1920×1200 @ 30 fps</text><rect x="420" y="296" width="520" height="34" rx="8" fill="#16243f"/><rect x="420" y="296" width="195" height="34" rx="8" fill="#30d158"><animate attributeName="width" from="0" to="195" dur="0.9s" begin="0.36s" fill="freeze"/></rect><text class="it" x="627" y="320">6 Mbps</text><text class="it" x="40" y="382" style="font-weight:700">4  1080p60</text><text class="dim" x="190" y="382">1920×1200 @ 60 fps</text><rect x="420" y="358" width="520" height="34" rx="8" fill="#16243f"/><rect x="420" y="358" width="325" height="34" rx="8" fill="#ffd60a"><animate attributeName="width" from="0" to="325" dur="0.9s" begin="0.48s" fill="freeze"/></rect><text class="it" x="757" y="382">10 Mbps</text><text class="it" x="40" y="444" style="font-weight:700">5  native</text><text class="dim" x="190" y="444">Mac’s own @ 60 fps</text><rect x="420" y="420" width="520" height="34" rx="8" fill="#16243f"/><rect x="420" y="420" width="520" height="34" rx="8" fill="#ff9f0a"><animate attributeName="width" from="0" to="520" dur="0.9s" begin="0.60s" fill="freeze"/></rect><text class="it" x="952" y="444">16 Mbps</text>
  <text class="sub" x="40" y="520">JPEG fallback uses the same rungs but caps at 20 fps. Refinement: when the screen goes still, one sharper keyframe is sent (not below 2.5 Mbps).</text>
</svg>